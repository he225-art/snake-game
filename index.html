<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>뱀 게임</title>
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1e1e2e; color: #eee; font-family: sans-serif; }
  canvas { background: #11111b; border: 2px solid #444; }
  p { margin: 8px; }
  #rank { margin: 4px 0 0; padding-left: 28px; min-width: 200px; font-size: 14px; }
</style>
</head>
<body>
<p>점수: <span id="score">0</span></p>
<canvas id="c" width="400" height="400"></canvas>
<p id="msg">방향키(또는 WASD)로 시작</p>
<p>🏆 랭킹 TOP 10</p>
<ol id="rank"><li>불러오는 중…</li></ol>
<script>
const SIZE = 20, CELLS = 20, SPEED = 120;
const ctx = document.getElementById('c').getContext('2d');
const scoreEl = document.getElementById('score'), msgEl = document.getElementById('msg');
const DIRS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
// 공개용(anon) 키: 브라우저에 보여도 되며, 권한은 Supabase 보안 규칙(조회·추가만)으로 제한됨
const SB_URL = 'https://kjlnutuxaobsuazdmyde.supabase.co/rest/v1/scores';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqbG51dHV4YW9ic3VhemRteWRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNTExMzcsImV4cCI6MjEwNjcyNzEzN30.T-3AszLoBckyQHyh_TGcXfG_3GjkHpuabVJgC_mvhMg';
const SB_HEADERS = { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' };
const rankEl = document.getElementById('rank');

async function loadRank() {
  try {
    const res = await fetch(`${SB_URL}?select=name,score&order=score.desc,created_at.asc&limit=10`, { headers: SB_HEADERS });
    if (!res.ok) throw new Error(res.status);
    const rows = await res.json();
    rankEl.replaceChildren(...rows.map(({ name, score }) => {
      const li = document.createElement('li');
      li.textContent = `${name} — ${score}점`; // textContent라서 이름에 태그를 넣어도 실행되지 않음
      return li;
    }));
    if (!rows.length) rankEl.innerHTML = '<li>아직 기록이 없어요</li>';
  } catch { rankEl.innerHTML = '<li>랭킹을 불러오지 못했어요</li>'; }
}

async function saveScore(s) {
  // shortcut: 기본 prompt 창 사용, 디자인을 맞추고 싶어지면 입력칸으로 교체
  const name = prompt(`점수 ${s}점! 랭킹에 올릴 이름 (12자까지, 취소하면 안 올림)`, localStorage.getItem('snakeName') || '')?.trim().slice(0, 12);
  if (!name) return;
  try { localStorage.setItem('snakeName', name); } catch {}
  const res = await fetch(SB_URL, { method: 'POST', headers: SB_HEADERS, body: JSON.stringify({ name, score: s }) });
  if (!res.ok) msgEl.textContent = '점수 저장에 실패했어요 — 스페이스바로 다시 시작';
  loadRank();
}

let snake, dir, nextDir, food, score, timer, over = false;

function reset() {
  snake = [[10, 10], [9, 10], [8, 10]];
  dir = nextDir = [1, 0];
  score = 0; scoreEl.textContent = 0;
  placeFood(); draw();
}

function placeFood() {
  do food = [Math.floor(Math.random() * CELLS), Math.floor(Math.random() * CELLS)];
  while (snake.some(([x, y]) => x === food[0] && y === food[1]));
}

function step() {
  dir = nextDir;
  const head = [snake[0][0] + dir[0], snake[0][1] + dir[1]];
  const ate = head[0] === food[0] && head[1] === food[1];
  const body = ate ? snake : snake.slice(0, -1); // 꼬리는 이번 칸에서 빠지므로 충돌 대상에서 제외
  if (head[0] < 0 || head[1] < 0 || head[0] >= CELLS || head[1] >= CELLS || body.some(([x, y]) => x === head[0] && y === head[1])) {
    clearInterval(timer); timer = null; over = true;
    msgEl.textContent = `게임 오버! 점수 ${score} — 스페이스바로 다시 시작`;
    if (score > 0) setTimeout(() => saveScore(score), 50); // 마지막 화면이 그려진 뒤 이름 입력창 띄우기
    return;
  }
  snake = [head, ...body];
  if (ate) { score++; scoreEl.textContent = score; placeFood(); }
  draw();
}

function draw() {
  ctx.clearRect(0, 0, 400, 400);
  ctx.fillStyle = '#f38ba8';
  ctx.fillRect(food[0] * SIZE + 2, food[1] * SIZE + 2, SIZE - 4, SIZE - 4);
  snake.forEach(([x, y], i) => {
    ctx.fillStyle = i === 0 ? '#a6e3a1' : '#74c7a0';
    ctx.fillRect(x * SIZE + 1, y * SIZE + 1, SIZE - 2, SIZE - 2);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === ' ' && !timer) { reset(); over = false; msgEl.textContent = ''; timer = setInterval(step, SPEED); e.preventDefault(); return; }
  const d = DIRS[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (!d) return;
  e.preventDefault();
  if (d[0] === -dir[0] && d[1] === -dir[1]) return; // 반대 방향으로 바로 꺾기 금지
  nextDir = d;
  if (!timer && !over) { msgEl.textContent = ''; timer = setInterval(step, SPEED); }
});

reset();
loadRank();
</script>
</body>
</html>
